name: PR APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to build an APK for"
        required: true
        type: number

concurrency:
  group: pr-apk-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  PUB_SUMMARY_ONLY: true
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual PR source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('PR APKs can only be built from branches in this repository because every APK uses the Flex release signing key.');
            }

      # Submodules are deliberately not fetched here: actions/checkout clones
      # them with --depth=1, leaving the Flutter submodule without tags and
      # reporting version 0.0.0-unknown. The manual submodule update below
      # clones it in full instead. Credentials are not persisted because
      # manual runs build unreviewed fork code, which must not find a token
      # in the git config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard Android release contract
        run: |
          python3 scripts/check-release-invariants.py --base-ref origin/main
          python3 -m unittest discover -s scripts/tests -p test_release_invariants.py

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter --version
          flutter/bin/flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Tune Gradle for CI runner memory
        run: |
          sed -i \
            -e 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:ActiveProcessorCount=2/' \
            -e 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' \
            android/gradle.properties

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Configure Android signing
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk \
            "flex-pr-${PR_NUMBER}.apk"
          ./scripts/verify-android-release-signing.sh "flex-pr-${PR_NUMBER}.apk"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flex-pr-${{ env.PR_NUMBER }}
          path: flex-pr-*.apk
          retention-days: 14

      - name: Add job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### 📱 PR APK built"
            echo ""
            echo "[Download the APK]($ARTIFACT_URL) (zipped, expires in 14 days)."
            echo ""
            echo "This is the normal **Flex** app (\`com.presley.flexify\`) signed with the release key, so it updates the existing Flex installation in place."
          } >> "$GITHUB_STEP_SUMMARY"

      # The GITHUB_TOKEN on fork PRs is read-only, so commenting only works
      # for same-repo PRs and owner-triggered manual runs; fork contributors
      # get the job summary instead.
      - name: Comment download link on PR
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- pr-apk-comment -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const body = [
              marker,
              '### 📱 PR APK built',
              '',
              `[Download the APK](${process.env.ARTIFACT_URL}) (zipped, expires in 14 days) to test this change.`,
              '',
              `Built from ${pr.head.sha}. This is the normal **Flex** app (\`com.presley.flexify\`) signed with the release key, so it updates the existing Flex installation in place.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
