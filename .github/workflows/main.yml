name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "pubspec.yaml"
  pull_request:
    branches: [main]
  # GitHub cron cannot express a true fortnightly interval. Run weekly,
  # then release only when the previous published release is at least 14 days old.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_SUMMARY_ONLY: true

# Keep scheduled/manual releases separate from push checks. A new push must
# never cancel an in-progress release, especially during the version bump.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'checks' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.cadence.outputs.should_release }}
    steps:
      - name: Check release cadence and changes
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
          if [[ -z "$latest_tag" || -z "$published_at" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest_tag...$GITHUB_SHA" --jq '.ahead_by' 2>/dev/null || echo 1)"
          if [[ "$ahead" == "0" ]]; then
            echo "No commits since $latest_tag; skipping scheduled release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published_epoch="$(date -u -d "$published_at" +%s)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch - published_epoch < 1209600 )); then
            echo "Latest release is less than 14 days old; skipping scheduled release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  quality-checks:
    needs: release-gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.release-gate.outputs.should_release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter --version
          flutter/bin/flutter config --no-analytics

      - name: Check
        run: ./scripts/check.sh

  generate-screenshots:
    needs: release-gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.release-gate.outputs.should_release == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
            screen_size: 1080x2160
          - device_type: sevenInchScreenshots
            profile: Nexus 7
            screen_size: 1920x1080
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Configure Android signing
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Install pinned Android NDK with recovery
        run: bash ./scripts/ensure-ci-ndk.sh 28.2.13676358

      # Compile before launching the emulator: simultaneous Gradle compilation and
      # software-rendered Android caused VM-service connection timeouts on CI.
      - name: Build screenshot profile APK
        run: flutter build apk --profile --target=integration_test/screenshot_test.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FLEX_DEVICE_TYPE: ${{ matrix.device_type }}
          SCREENSHOT_SCREEN_SIZE: ${{ matrix.screen_size }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci-screenshots.sh

      - name: Upload ${{ matrix.device_type }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  generate-desktop-screenshots:
    needs: release-gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.release-gate.outputs.should_release == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter config --enable-web

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Capture desktop screenshots
        timeout-minutes: 20
        run: ./scripts/screenshots-chrome.sh desktop

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-failure
          path: fastlane/screenshots/desktop-debug.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload desktop screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-desktop
          path: fastlane/screenshots/desktop-*_en-US.png
          if-no-files-found: error
          retention-days: 7

  version-bump:
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.release-gate.outputs.should_release == 'true' && needs.quality-checks.result == 'success' }}
    needs: [release-gate, quality-checks, generate-screenshots, generate-desktop-screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changelog_number: ${{ steps.bump.outputs.changelog_number }}
      commit_sha: ${{ steps.commit-push.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Download phone screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download seven-inch screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download ten-inch screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Download desktop screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: screenshots-desktop
          path: fastlane/screenshots

      - name: Check screenshot assets and sync desktop copies
        run: |
          for device in phoneScreenshots sevenInchScreenshots tenInchScreenshots; do
            for number in {1..8}; do
              test -s "fastlane/metadata/android/en-US/images/$device/${number}_en-US.png"
            done
          done
          mkdir -p fastlane/metadata/android/en-US/images/desktop
          for number in {1..8}; do
            image="fastlane/screenshots/desktop-${number}_en-US.png"
            test -s "$image"
            cp "$image" "fastlane/metadata/android/en-US/images/desktop/${number}_en-US.png"
          done
          if [[ "${{ needs.generate-screenshots.result }}" != success || "${{ needs.generate-desktop-screenshots.result }}" != success ]]; then
            echo "::warning::Screenshot generation failed; using previously committed images where necessary."
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump versions and generate changelog
        id: bump
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          CURRENT_BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          CURRENT_MSIX=$(grep 'msix_version:' pubspec.yaml | sed 's/.*msix_version: *//')

          IFS='.' read -ra V <<< "$CURRENT_VERSION"
          NEW_PATCH=$((${V[2]} + 1))
          NEW_VERSION="${V[0]}.${V[1]}.$NEW_PATCH"
          NEW_BUILD=$((CURRENT_BUILD + 1))
          CHANGELOG_NUMBER=$((NEW_BUILD * 10 + 3))

          IFS='.' read -ra M <<< "$CURRENT_MSIX"
          NEW_MSIX="${M[0]}.${M[1]}.$((${M[2]} + 1)).${M[3]}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "changelog_number=$CHANGELOG_NUMBER" >> "$GITHUB_OUTPUT"

          sed -i "s/^version: .*/version: $NEW_VERSION+$NEW_BUILD/" pubspec.yaml
          sed -i "s/msix_version: .*/msix_version: $NEW_MSIX/" pubspec.yaml

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/$CHANGELOG_NUMBER.txt"
          mkdir -p "$(dirname "$CHANGELOG_FILE")"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git --no-pager log --pretty=format:'%s' "$LAST_TAG"..HEAD
          else
            git --no-pager log --pretty=format:'%s'
          fi | sort -u \
            | grep -v "^Merge " \
            | grep -v "^Release " \
            | grep -v "^Bump " \
            | grep -v "\[skip ci\]" \
            | head -10 \
            | sed 's/^/• /' > "$CHANGELOG_FILE"

          [ -s "$CHANGELOG_FILE" ] || echo "• Bug fixes and improvements" > "$CHANGELOG_FILE"

          mkdir -p assets/changelogs
          cp "$CHANGELOG_FILE" "assets/changelogs/$(date +%s).txt"

      - name: Commit and push version bump
        id: commit-push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add pubspec.yaml fastlane/metadata fastlane/screenshots assets/changelogs
          git commit -m "Release $RELEASE_VERSION [skip ci]"
          gh auth setup-git
          git push origin main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-android:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Create brandon user directory structure (match F-Droid)
        run: |
          sudo mkdir -p /home/brandon
          sudo chown $USER -R /home/brandon

      - name: Move project to F-Droid location
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          cd ..
          mv "$REPO_NAME" /home/brandon/flex

      - name: Normalize Android SDK path
        working-directory: /home/brandon/flex
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo mount --bind "$ANDROID_HOME" /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"

      - name: Setup Flutter from submodule and get dependencies
        working-directory: /home/brandon/flex
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "/home/brandon/flex/flutter/bin" >> "$GITHUB_PATH"
          export PUB_CACHE=$(pwd)/.pub-cache
          echo "PUB_CACHE=$(pwd)/.pub-cache" >> "$GITHUB_ENV"
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter pub get --enforce-lockfile

      - name: Install pinned Android NDK with recovery
        working-directory: /home/brandon/flex
        run: bash ./scripts/ensure-ci-ndk.sh 28.2.13676358

      - name: Run build_runner
        working-directory: /home/brandon/flex
        run: dart run build_runner build -d

      - name: Decode Android keystore
        working-directory: /home/brandon/flex
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Tune Gradle for CI runner memory
        working-directory: /home/brandon/flex
        run: |
          sed -i \
            -e 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:ActiveProcessorCount=2/' \
            -e 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' \
            android/gradle.properties

      - name: Remove stale local.properties to ensure version from pubspec.yaml
        working-directory: /home/brandon/flex
        run: rm -f android/local.properties

      - name: Build android (one ABI at a time)
        working-directory: /home/brandon/flex
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
          flutter build apk --release --split-per-abi --target-platform android-x64
          flutter build apk --release --split-per-abi --target-platform android-arm64
          flutter build apk --release --split-per-abi --target-platform android-arm
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/flex.apk
          flutter build appbundle
          ./scripts/verify-android-release-signing.sh build/app/outputs/flutter-apk/*.apk
          mkdir -p "${GITHUB_WORKSPACE}/build"
          mv build/* "${GITHUB_WORKSPACE}/build"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/flex.apk
            build/app/outputs/bundle/release/app-release.aab

  build-linux:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Linux
        run: flutter build linux

      - name: Create Linux zip
        run: |
          cd build/linux/x64/release/bundle
          zip -r flex-linux.zip .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: linux-builds
          path: build/linux/x64/release/bundle/flex-linux.zip

  build-windows:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$env:GITHUB_WORKSPACE\flutter\bin" >> $env:GITHUB_PATH
          flutter\bin\flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Windows
        run: flutter build windows

      - name: Create Windows zip
        run: Compress-Archive -Path ./build/windows/x64/runner/Release/* -DestinationPath ./flex-windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: windows-builds
          path: flex-windows.zip

  build-and-deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable web support
        run: flutter config --enable-web

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Flutter web
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Add privacy policy to web deployment
        run: cp docs/privacy-policy.html build/web/privacy-policy.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  create-github-release:
    needs: [version-bump, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "$RELEASE_VERSION"
          gh auth setup-git
          git push origin "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version-bump.outputs.version }}
          name: ${{ needs.version-bump.outputs.version }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ needs.version-bump.outputs.changelog_number }}.txt
          files: |
            android-builds/flutter-apk/app-*-release.apk
            android-builds/flutter-apk/flex.apk
            android-builds/bundle/release/app-release.aab
            linux-builds/flex-linux.zip
            windows-builds/flex-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-windows-store:
    needs: [version-bump, build-windows]
    uses: ./.github/workflows/deploy-windows-store.yml
    with:
      ref: ${{ needs.version-bump.outputs.commit_sha }}
    secrets: inherit

  virustotal:
    needs: [create-github-release, version-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-builds
          path: android-builds

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            android-builds/flutter-apk/app-arm64-v8a-release.apk
            android-builds/flutter-apk/app-armeabi-v7a-release.apk
            android-builds/flutter-apk/app-x86_64-release.apk

      - name: Append VirusTotal links to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-bump.outputs.version }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VT_SECTION=$'\n\n<details>\n<summary>VirusTotal Analysis</summary>\n\n'
          IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
          for entry in "${ENTRIES[@]}"; do
            filename=$(basename "${entry%%=*}")
            url="${entry#*=}"
            VT_SECTION+="- [${filename}](${url})"$'\n'
          done
          VT_SECTION+=$'\n</details>'
          CURRENT_BODY=$(gh release view "$VERSION" --repo "$REPOSITORY" --json body -q .body)
          gh release edit "$VERSION" --repo "$REPOSITORY" --notes "${CURRENT_BODY}${VT_SECTION}"
