name: Deploy to Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-google-play
  cancel-in-progress: true

jobs:
  deploy-google-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          latest: true
          fileName: app-release.aab

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create Google Play JSON key file
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > google-play-key.json
          mkdir -p ~/.config
          cp google-play-key.json ~/.config/googlePlay.json

      - name: Deploy to Google Play
        run: |
          set +e
          bundle exec fastlane android metadata track:production
          bundle exec fastlane supply \
            --aab app-release.aab \
            --json_key google-play-key.json \
            --package_name com.presley.flexify \
            --track production \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -qE 'Version code [0-9]+ has already been used' deploy.log; then
            echo "The latest release is already uploaded or pending review in Google Play."
            exit 0
          fi
          exit "$status"
