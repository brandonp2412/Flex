name: Sync Google Play listing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-metadata
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure Google Play credentials
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          mkdir -p ~/.config
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > ~/.config/googlePlay.json
      - run: bundle exec fastlane android metadata track:production
