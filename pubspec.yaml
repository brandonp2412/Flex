name: flex
description: Track gym progress, visualize graphs, enjoy offline support & timers
publish_to: none
version: 2.2.38+452
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.8"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  talker_flutter: 5.1.20
  drift: ^2.35.2
  path_provider: ^2.1.2
  path: ^1.8.3
  csv: ^8.0.0
  intl: ^0.20.2
  permission_handler: ^13.0.0
  provider: ^6.1.1
  dynamic_color: ^1.9.0
  sqlite3: ^3.5.1
  archive: ^4.0.2
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  audioplayers: ^6.5.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.6
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.2.0
  msvcredist:
    git:
      url: https://github.com/insertjokehere/flutter_msvcredist.git
      ref: main
  timeago: ^3.2.2
  sqlite3_web: ^0.9.4
  drift_dev: ^2.35.1
  drafter: ^0.3.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.8.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  msix:
    git:
      url: https://github.com/insertjokehere/msix.git
      ref: msvc_redist

dependency_overrides:
  # https://github.com/bluefireteam/audioplayers/pull/2019
  # Prevent native Windows crashes when Media Foundation is unavailable.
  audioplayers_windows:
    git:
      url: https://github.com/bluefireteam/audioplayers.git
      ref: 1dab3825cba3b21fd2fe2ec0cf333271da6c49e6
      path: packages/audioplayers_windows
  # https://github.com/flutter/flutter/issues/184750
  # 2.3.x moved Android path lookup to JNI and can SIGSEGV in release mode.
  path_provider_android: 2.2.23
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/changelogs/
    - assets/changelogs/l10n/
flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/ic_launcher.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/ic_launcher.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/ic_launcher.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/ic_launcher.png
msix_config:
  msstore_appId: 9P13THVK7F69
  display_name: "Flex: Gym tracker"
  publisher_display_name: Brandon Dick
  identity_name: FrisbeeSoftware.Flexify
  msix_version: 1.0.290.0
  logo_path: assets/ic_launcher.png
  trim_logo: false
  publisher: CN=BB0811CB-EED5-441C-BE1B-D31F391F76DE
  store: true

