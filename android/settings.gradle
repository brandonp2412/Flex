pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.4.1' apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

def buildLockFile = new File(settingsDir, '.gradle/flex-build.lock')
buildLockFile.parentFile.mkdirs()
def buildLockChannel = java.nio.channels.FileChannel.open(
    buildLockFile.toPath(),
    java.nio.file.StandardOpenOption.CREATE,
    java.nio.file.StandardOpenOption.WRITE
)
def buildLock = buildLockChannel.tryLock()
if (buildLock == null) {
    logger.lifecycle("Waiting for another Flex Android build to finish")
    buildLock = buildLockChannel.lock()
}
gradle.buildFinished {
    try {
        buildLock.release()
    } finally {
        buildLockChannel.close()
    }
}

gradle.beforeProject { target ->
    target.buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build"
                    && details.requested.name == "gradle") {
                details.useVersion("9.4.1")
                details.because("Use the host app's AGP for all Flutter plugin subprojects")
            }
        }
    }
}

include ":app"
