plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def isFdroidBuild = System.getenv('fdroidserver') != null &&
    System.getenv('home_vagrant') != null

def keystoreProperties = new Properties()
def projectKeystorePropertiesFile = rootProject.file('key.properties')
def userKeystorePropertiesFile = new File(System.getProperty('user.home'), '.config/android-signing/flexify-release.properties')
def keystorePropertiesFile = projectKeystorePropertiesFile.isFile()
    ? projectKeystorePropertiesFile
    : (!isFdroidBuild && userKeystorePropertiesFile.isFile()
        ? userKeystorePropertiesFile
        : projectKeystorePropertiesFile)
if (keystorePropertiesFile.isFile()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingPolicy = new Properties()
def signingPolicyFile = rootProject.file('signing-policy.properties')
if (!signingPolicyFile.isFile()) {
    throw new GradleException("Missing Android signing policy: " + signingPolicyFile)
}
signingPolicyFile.withInputStream { signingPolicy.load(it) }

def productionApplicationId = signingPolicy.getProperty('productionApplicationId')
def expectedReleaseCertificateSha256 = signingPolicy
    .getProperty('githubReleaseCertificateSha256', '')
    .replaceAll('[^0-9A-Fa-f]', '')
    .toLowerCase()

if (productionApplicationId != 'com.presley.flexify' ||
    expectedReleaseCertificateSha256 != '011ee1a6e4e5ecd675f67fbf3d78ad82614a7a7a3f24ed71cc9c417154a0f0fd') {
    throw new GradleException("Android release identity differs from the pinned Flex contract.")
}

def signingCertificateSha256 = { signingConfig ->
    if (signingConfig == null ||
        signingConfig.storeFile == null ||
        !signingConfig.storeFile.isFile() ||
        !signingConfig.storePassword ||
        !signingConfig.keyAlias) {
        return null
    }

    def keyStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
    signingConfig.storeFile.withInputStream {
        keyStore.load(it, signingConfig.storePassword.toCharArray())
    }
    def certificate = keyStore.getCertificate(signingConfig.keyAlias)
    if (certificate == null) {
        return null
    }

    return java.security.MessageDigest.getInstance('SHA-256')
        .digest(certificate.encoded)
        .collect { String.format('%02x', it & 0xff) }
        .join()
}

android {
    namespace "com.presley.flex"
    compileSdkVersion 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId productionApplicationId
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Reproducible builds configuration
    packagingOptions {
        // Exclude files that can cause reproducibility issues
        excludes += ['META-INF/DEPENDENCIES']
        excludes += ['META-INF/LICENSE']
        excludes += ['META-INF/LICENSE.txt']
        excludes += ['META-INF/NOTICE']
        excludes += ['META-INF/NOTICE.txt']
        excludes += ['LICENSE-junit.txt']
        excludes += ['META-INF/services/U1.a']
        excludes += ['META-INF/services/U1.b']
        excludes += ['META-INF/services/X1.a']
        excludes += ['META-INF/services/X1.b']
        // Ensure deterministic ordering
        pickFirsts += ['**/libc++_shared.so']
        pickFirsts += ['**/libjsc.so']
        // Exclude problematic directories
        excludes += ['androidx/**']
        excludes += ['junit/**']
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   buildTypes {
       profile {
           if (keystorePropertiesFile.exists()) {
               signingConfig = signingConfigs.release
           }
       }
       debug {
           if (keystorePropertiesFile.exists()) {
               signingConfig = signingConfigs.release
           }
       }
       release {
           if (keystorePropertiesFile.isFile()) {
               signingConfig = signingConfigs.release
           }
       }
   }
   // https://github.com/brandonp2412/Flex/issues/125
   dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

gradle.taskGraph.whenReady { taskGraph ->

    def packagingTasks = taskGraph.allTasks.findAll { task ->
        task.project == project &&
            task.name ==~ /(?i)^(assemble|bundle|package|install).*/
    }
    if (packagingTasks.isEmpty()) {
        return
    }

    android.buildTypes.each { buildType ->
        def buildTypeRequested = packagingTasks.any { task ->
            task.name.toLowerCase().contains(buildType.name.toLowerCase())
        }
        if (!buildTypeRequested) {
            return
        }

        def signingConfig = buildType.signingConfig
        if (buildType.name == 'release' && isFdroidBuild) {
            if (signingConfig?.storeFile?.isFile()) {
                throw new GradleException("F-Droid release must be unsigned; a signing key was injected.")
            }
            return
        }
        if (signingConfig == null ||
            signingConfig.storeFile == null ||
            !signingConfig.storeFile.isFile()) {
            throw new GradleException(
                "Refusing to package " + productionApplicationId +
                " without the Flex release signing key."
            )
        }

        def actualCertificateSha256 = signingCertificateSha256(signingConfig)
        if (actualCertificateSha256 != expectedReleaseCertificateSha256) {
            throw new GradleException(
                "Refusing to package " + productionApplicationId +
                " with the wrong signing key. Expected SHA-256 " +
                expectedReleaseCertificateSha256 + " but got " +
                (actualCertificateSha256 ?: '<missing>') + "."
            )
        }
    }
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 100 + abiVersionCode
        } else if (output.getFilter(com.android.build.OutputFile.ABI) == null) {
            // This is a universal APK
            output.versionCodeOverride = variant.versionCode * 100 + 3
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Flutter generates a release registrant for integration_test but omits its dev-only classpath.
    releaseImplementation project(':integration_test')
    implementation 'androidx.documentfile:documentfile:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Flutter's integration_test plugin currently pins these compatible versions.
    androidTestImplementation 'androidx.test:core:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
}
